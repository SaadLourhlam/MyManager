<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyManager - Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
                        <rect width="60" height="60" rx="8" fill="url(#grad)"/>
                        <text x="30" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="white">MM</text>
                        <defs>
                            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#7B2CBF;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#5A189A;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1 id="loginTitle">MyManager</h1>
                <p id="loginSubtitle">Gestion Backoffice Professionnelle</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username" id="usernameLabel">Identifiant</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="admin" 
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password" id="passwordLabel">Mot de passe</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="•••••••" 
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="form-group checkbox">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe" id="rememberLabel">Se souvenir de moi</label>
                </div>

                <button type="submit" class="btn btn-primary btn-large" id="loginBtn">Se connecter</button>

                <div id="loginError" class="alert alert-error" style="display: none;"></div>
            </form>

            <div class="login-footer">
                <p id="demoText">Démo: Utilisateur: <strong>admin</strong> | Mot de passe: <strong>admin</strong></p>
                <div class="language-selector">
                    <button class="lang-btn active" data-lang="fr">FR</button>
                    <button class="lang-btn" data-lang="en">EN</button>
                    <button class="lang-btn" data-lang="ar">AR</button>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/translations.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
