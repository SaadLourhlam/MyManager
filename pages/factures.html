<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factures - MyManager</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/crud.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
    <script src="../assets/js/data-manager.js"></script>
<div class="crud-container">
    <div class="crud-header">
        <div class="crud-title">
            <h1>Gestion des Factures</h1>
            <p>Gérez les factures et le suivi de paiement</p>
        </div>
        <div class="crud-actions">
            <button class="btn btn-primary" onclick="openAddInvoiceForm()">+ Nouvelle Facture</button>
            <button class="btn btn-light" onclick="exportInvoicesCSV()">📥 Exporter CSV</button>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters-container">
        <div class="search-bar">
            <input type="text" id="searchInvoices" placeholder="Rechercher une facture...">
        </div>
        <div class="filter-group">
            <label for="statusFilter">Statut:</label>
            <select id="statusFilter">
                <option value="">Tous</option>
                <option value="payée">Payée</option>
                <option value="en attente">En attente</option>
                <option value="annulée">Annulée</option>
            </select>
        </div>
        <div class="sort-control">
            <span>Trier par:</span>
            <select id="sortInvoices">
                <option value="date">Date</option>
                <option value="amount">Montant</option>
                <option value="status">Statut</option>
            </select>
        </div>
    </div>

    <!-- Table -->
    <div class="table-container">
        <table id="invoicesTable">
            <thead>
                <tr>
                    <th>Numéro</th>
                    <th>Client</th>
                    <th>Montant</th>
                    <th>Statut</th>
                    <th>Date</th>
                    <th>Date d'échéance</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="invoicesPagination"></div>
</div>

<!-- Modal -->
<div id="invoiceModal" class="modal">
    <div class="modal-content">
        <button class="modal-close">&times;</button>
        <h2 id="modalTitle">Nouvelle Facture</h2>
        <form id="invoiceForm" class="form-container">
            <div class="form-row">
                <div class="form-group">
                    <label for="invoiceClient">Client *</label>
                    <select id="invoiceClient" required>
                        <option value="">-- Sélectionner --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="invoiceStatus">Statut *</label>
                    <select id="invoiceStatus" required>
                        <option value="">-- Sélectionner --</option>
                        <option value="payée">Payée</option>
                        <option value="en attente">En attente</option>
                        <option value="annulée">Annulée</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="invoiceAmount">Montant *</label>
                    <input type="number" id="invoiceAmount" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="invoiceDate">Date d'émission *</label>
                    <input type="date" id="invoiceDate" required>
                </div>
            </div>
            <div class="form-group">
                <label for="invoiceDueDate">Date d'échéance *</label>
                <input type="date" id="invoiceDueDate" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <button type="button" class="btn btn-light" onclick="closeInvoiceModal()">Annuler</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal for viewing invoice details -->
<div id="detailsModal" class="modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeDetailsModal()">&times;</button>
        <div id="detailsContent"></div>
    </div>
</div>

<script>
    let invoicesData = [...dataManager.factures];
    let currentPage = 1;
    const itemsPerPage = 10;
    let editingId = null;

    document.addEventListener('DOMContentLoaded', () => {
        populateClientSelect();
        renderInvoicesTable();
        setupEventListeners();
    });

    function populateClientSelect() {
        const select = document.getElementById('invoiceClient');
        dataManager.clients.forEach(client => {
            const option = document.createElement('option');
            option.value = client.id;
            option.textContent = client.name;
            select.appendChild(option);
        });
    }

    function setupEventListeners() {
        document.getElementById('searchInvoices').addEventListener('input', filterAndRender);
        document.getElementById('statusFilter').addEventListener('change', filterAndRender);
        document.getElementById('sortInvoices').addEventListener('change', filterAndRender);
        document.getElementById('invoiceForm').addEventListener('submit', (e) => {
            e.preventDefault();
            saveInvoice();
        });
        document.querySelector('.modal-close').addEventListener('click', closeInvoiceModal);
    }

    function filterAndRender() {
        const searchTerm = document.getElementById('searchInvoices').value.toLowerCase();
        const statusFilter = document.getElementById('statusFilter').value;
        const sortBy = document.getElementById('sortInvoices').value;

        invoicesData = dataManager.factures.filter(invoice => {
            const client = dataManager.clients.find(c => c.id === invoice.clientId);
            const clientName = client ? client.name : '';
            const matchSearch = invoice.id.toLowerCase().includes(searchTerm) || clientName.toLowerCase().includes(searchTerm);
            const matchStatus = !statusFilter || invoice.status === statusFilter;
            return matchSearch && matchStatus;
        });

        if (sortBy === 'date') {
            invoicesData.sort((a, b) => new Date(b.date) - new Date(a.date));
        } else if (sortBy === 'amount') {
            invoicesData.sort((a, b) => b.amount - a.amount);
        } else if (sortBy === 'status') {
            invoicesData.sort((a, b) => a.status.localeCompare(b.status));
        }

        currentPage = 1;
        renderInvoicesTable();
    }

    function renderInvoicesTable() {
        const tbody = document.querySelector('#invoicesTable tbody');
        tbody.innerHTML = '';

        if (invoicesData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><div>Aucune facture trouvée</div></td></tr>';
            document.getElementById('invoicesPagination').innerHTML = '';
            return;
        }

        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageData = invoicesData.slice(start, end);

        pageData.forEach(invoice => {
            const client = dataManager.clients.find(c => c.id === invoice.clientId);
            const clientName = client ? client.name : 'Inconnu';
            const statusClass = 'status-badge ' + invoice.status.replace(' ', '-');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${invoice.id}</strong></td>
                <td>${clientName}</td>
                <td><strong>${invoice.amount.toFixed(2)} €</strong></td>
                <td><span class="${statusClass}">${invoice.status}</span></td>
                <td>${invoice.date}</td>
                <td>${invoice.dueDate}</td>
                <td>
                    <div class="action-buttons">
                        <button class="btn-action" onclick="viewInvoiceDetails(${invoice.id})">Voir</button>
                        <button class="btn-action" onclick="editInvoice('${invoice.id}')">Éditer</button>
                        <button class="btn-action delete" onclick="deleteInvoice('${invoice.id}')">Supprimer</button>
                    </div>
                </td>
            `;
            tbody.appendChild(row);
        });

        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(invoicesData.length / itemsPerPage);
        const pagination = document.getElementById('invoicesPagination');
        pagination.innerHTML = '';

        if (totalPages <= 1) return;

        const prevBtn = document.createElement('button');
        prevBtn.textContent = '← Précédent';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => {
            if (currentPage > 1) {
                currentPage--;
                renderInvoicesTable();
            }
        };
        pagination.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.textContent = i;
            pageBtn.className = currentPage === i ? 'active' : '';
            pageBtn.onclick = () => {
                currentPage = i;
                renderInvoicesTable();
            };
            pagination.appendChild(pageBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.textContent = 'Suivant →';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderInvoicesTable();
            }
        };
        pagination.appendChild(nextBtn);
    }

    function openAddInvoiceForm() {
        editingId = null;
        document.getElementById('modalTitle').textContent = 'Nouvelle Facture';
        document.getElementById('invoiceForm').reset();
        document.getElementById('invoiceDate').valueAsDate = new Date();
        const dueDate = new Date();
        dueDate.setMonth(dueDate.getMonth() + 1);
        document.getElementById('invoiceDueDate').valueAsDate = dueDate;
        document.getElementById('invoiceModal').classList.add('active');
    }

    function editInvoice(id) {
        const invoice = dataManager.factures.find(i => i.id === id);
        if (!invoice) return;

        editingId = id;
        document.getElementById('modalTitle').textContent = 'Modifier la Facture';
        document.getElementById('invoiceClient').value = invoice.clientId;
        document.getElementById('invoiceStatus').value = invoice.status;
        document.getElementById('invoiceAmount').value = invoice.amount;
        document.getElementById('invoiceDate').value = invoice.date;
        document.getElementById('invoiceDueDate').value = invoice.dueDate;
        document.getElementById('invoiceModal').classList.add('active');
    }

    function saveInvoice() {
        const clientId = parseInt(document.getElementById('invoiceClient').value);
        const status = document.getElementById('invoiceStatus').value;
        const amount = parseFloat(document.getElementById('invoiceAmount').value);
        const date = document.getElementById('invoiceDate').value;
        const dueDate = document.getElementById('invoiceDueDate').value;

        if (editingId) {
            const invoice = dataManager.factures.find(i => i.id === editingId);
            if (invoice) {
                invoice.clientId = clientId;
                invoice.status = status;
                invoice.amount = amount;
                invoice.date = date;
                invoice.dueDate = dueDate;
            }
        } else {
            const newInvoice = {
                id: 'FAC-' + new Date().getFullYear() + '-' + (Math.max(...dataManager.factures.map(i => parseInt(i.id.split('-')[2]) || 0), 0) + 1).toString().padStart(3, '0'),
                clientId,
                status,
                amount,
                date,
                dueDate,
                commandeId: 0
            };
            dataManager.factures.push(newInvoice);
        }

        closeInvoiceModal();
        filterAndRender();
    }

    function deleteInvoice(id) {
        if (confirm('Êtes-vous sûr de vouloir supprimer cette facture?')) {
            dataManager.factures = dataManager.factures.filter(i => i.id !== id);
            filterAndRender();
        }
    }

    function viewInvoiceDetails(invoiceId) {
        const invoice = dataManager.factures.find(i => i.id === invoiceId);
        if (!invoice) return;

        const html = `
            <h2>Détails de la Facture</h2>
            <div class="detail-item">
                <label>Numéro de Facture:</label>
                <p>${invoice.id}</p>
            </div>
            <div class="detail-item">
                <label>Client:</label>
                <p>${invoice.client}</p>
            </div>
            <div class="detail-item">
                <label>Montant:</label>
                <p>${invoice.amount} €</p>
            </div>
            <div class="detail-item">
                <label>Date d'émission:</label>
                <p>${invoice.date}</p>
            </div>
            <div class="detail-item">
                <label>Statut:</label>
                <p><span class="status-badge status-${invoice.status}">${invoice.status}</span></p>
            </div>
            <div class="detail-item">
                <label>Description:</label>
                <p>${invoice.description || '-'}</p>
            </div>
        `;
        document.getElementById('detailsContent').innerHTML = html;
        document.getElementById('detailsModal').classList.add('active');
    }

    function closeDetailsModal() {
        document.getElementById('detailsModal').classList.remove('active');
    }

    function closeInvoiceModal() {
        document.getElementById('invoiceModal').classList.remove('active');
        document.getElementById('invoiceForm').reset();
        editingId = null;
    }

    function exportInvoicesCSV() {
        let csv = 'Numéro,Client,Montant,Statut,Date,Date d\'échéance\n';
        invoicesData.forEach(invoice => {
            const client = dataManager.clients.find(c => c.id === invoice.clientId);
            const clientName = client ? client.name : 'Inconnu';
            csv += `"${invoice.id}","${clientName}","${invoice.amount}","${invoice.status}","${invoice.date}","${invoice.dueDate}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'factures.csv';
        a.click();
        window.URL.revokeObjectURL(url);
    }

    document.getElementById('invoiceModal').addEventListener('click', (e) => {
        if (e.target.id === 'invoiceModal') {
            closeInvoiceModal();
        }
    });
</script>
</body>
</html>
